name: pipeline
on: push

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r basic_app/requirements.txt
      - run: flake8 basic_app/ --max-line-length=100

  sast:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r basic_app/ -ll -s B104

  sca:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r basic_app/requirements.txt

  test:
    needs: [sast, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r basic_app/requirements.txt
      - run: python -m pytest basic_app/
        env:
          PYTHONPATH: basic_app
          APP_ENV: production

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./basic_app
          push: false
          no-cache: true
          load: true
          tags: myapp:${{ github.sha }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd Self-Healing-CICD-Pipeline &&
            git pull origin main &&
            cd basic_app &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            pkill -f "python app.py" || true &&
            sleep 2 &&
            nohup python app.py > /tmp/app.log 2>&1 &
          '
      - name: Health check
        run: |
          sleep 5
          curl --fail http://${{ secrets.EC2_HOST }}:5000/health
      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd Self-Healing-CICD-Pipeline &&
            git checkout HEAD~1 &&
            cd basic_app &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            pkill -f "python app.py" || true &&
            sleep 2 &&
            nohup python app.py > /tmp/app.log 2>&1 &
          '


          